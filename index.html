    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
        .status-allowed { background-color: #def7ec; color: #03543f; border: 1px solid #84e1bc; }
        .status-excluded { background-color: #fde8e8; color: #9b1c1c; border: 1px solid #f8b4b4; }
        .status-conditional { background-color: #fdf6b2; color: #723b13; border: 1px solid #faca15; }
        body { background-color: #fdf5e6; } /* 米黃色 (Old Lace) */
    </style>
</head>

    <div class="max-w-5xl mx-auto p-4 md:p-6">
        <!-- Header -->

            <h1 class="text-3xl font-bold text-gray-900 mb-2">台茂購物中心 禮券適用查詢</h1>
            <p class="text-gray-500">快速查詢指定櫃位是否可以使用台茂禮券</p>
            <p class="text-sm text-red-500 mt-1">※ 外送平台全面不配合使用此禮券 ※</p>
        </header>

        <!-- Search and Filter Controls -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-6 sticky top-2 z-10 border border-gray-100">
            <div class="flex flex-col md:flex-row gap-4 justify-between items-center">
                <div class="w-full md:w-1/2 relative">
                    <input type="text" id="searchInput" placeholder="請輸入店家名稱 (例如: 星巴克, UNIQLO)..."

                    <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                </div>
                
                <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
                    <button class="filter-btn active px-4 py-2 rounded-lg font-medium text-sm transition-colors bg-blue-600 text-white" data-filter="all">全部顯示</button>
                    <button class="filter-btn px-4 py-2 rounded-lg font-medium text-sm transition-colors bg-gray-100 text-gray-600 hover:bg-gray-200" data-filter="allowed">🟢 可使用</button>
                    <button class="filter-btn px-4 py-2 rounded-lg font-medium text-sm transition-colors bg-gray-100 text-gray-600 hover:bg-gray-200" data-filter="issue">🔴 不適用 / 🟡 條件限制</button>
                </div>
            </div>
        </div>

        <div id="storeGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">

        const filterBtns = document.querySelectorAll('.filter-btn');
        const resultsInfo = document.getElementById('resultsInfo');

        let currentFilter = 'all';
        let searchQuery = '';

        function renderStores() {
            storeGrid.innerHTML = '';
            
            const filteredStores = rawStores.filter(store => {
                const matchesSearch = store.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      store.category.toLowerCase().includes(searchQuery.toLowerCase());
                
                let matchesFilter = true;
                if (currentFilter === 'allowed') {
                    matchesFilter = store.status === 'allowed';
                } else if (currentFilter === 'issue') {
                    matchesFilter = store.status === 'excluded' || store.status === 'conditional';
                }

                return matchesSearch && matchesFilter;
            });

            resultsInfo.textContent = `共找到 ${filteredStores.length} 間符合條件的店家`;

            if(filteredStores.length === 0) {
                storeGrid.innerHTML = `<div class="col-span-full text-center py-10 text-gray-400">找不到符合條件的店家</div>`;
                return;
            }

            filteredStores.forEach(store => {
                const card = document.createElement('div');
                card.className = 'p-4 rounded-xl shadow-sm flex flex-col justify-between h-full bg-white transition-transform hover:-translate-y-1';
                
                let statusBadge = '';
                let statusClass = '';
                
                if (store.status === 'allowed') {
                    statusBadge = '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">🟢 可以使用</span>';
                    statusClass = 'border-l-4 border-green-400';
                } else if (store.status === 'excluded') {
                    statusBadge = '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800">🔴 不適用</span>';
                    statusClass = 'border-l-4 border-red-500 status-excluded';
                } else if (store.status === 'conditional') {
                    statusBadge = `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800">🟡 條件限制: ${store.note}</span>`;
                    statusClass = 'border-l-4 border-yellow-400 status-conditional';
                }

                card.classList.add(...statusClass.split(' '));

                card.innerHTML = `
                    <div>
                        <div class="text-xs text-gray-500 mb-1">${store.category}</div>
                        <h3 class="text-lg font-bold text-gray-900 mb-2">${store.name}</h3>
                    </div>
                    <div class="mt-3">
                        ${statusBadge}
                    </div>
                `;
                
                storeGrid.appendChild(card);
            });
        }

        // Event Listeners
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderStores();
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Update active button styling
                filterBtns.forEach(b => {
                    b.classList.remove('bg-blue-600', 'text-white');
                    b.classList.add('bg-gray-100', 'text-gray-600');
                });
                const clickedBtn = e.currentTarget;
                clickedBtn.classList.remove('bg-gray-100', 'text-gray-600');
                clickedBtn.classList.add('bg-blue-600', 'text-white');

                currentFilter = clickedBtn.dataset.filter;
                renderStores();
            });
        });

        // Initial render
        renderStores();
    </script>
</body>
</html>
